services:
    app:
        build:
            context: ./docker/php
        user: ${UID}:${GID}
        volumes:
            - .:/var/www
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_started
        dns:
            - 8.8.8.8
            - 1.1.1.1
        restart: unless-stopped

    nginx:
        image: nginx:${NGINX_VERSION}
        ports:
            - '8000:80'
        volumes:
            - .:/var/www
            - ./docker/nginx:/etc/nginx/conf.d
        depends_on:
            - app
        restart: unless-stopped

    db:
        image: mysql:${MYSQL_VERSION}
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            timeout: 20s
            retries: 10
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        ports:
            - '3306:3306'
        volumes:
            - db_data:/var/lib/mysql

    redis:
        image: redis:${REDIS_VERSION}
        restart: unless-stopped
        ports:
            - '6379:6379'
        volumes:
            - redis_data:/data
            - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
        command: redis-server /usr/local/etc/redis/redis.conf

    scheduler:
        build:
            context: ./docker/php
        volumes:
            - ./backend:/var/www
        command: supercronic /etc/supercronic/crontab
        depends_on:
            - app
            - db
            - redis
        dns:
            - 8.8.8.8
            - 1.1.1.1

    queue:
        build:
            context: ./docker/php
        volumes:
            - .:/var/www
            - ./docker/php/queue-worker.conf:/etc/supervisor/conf.d/queue-worker.conf
        command: supervisord -c /etc/supervisor/supervisord.conf -n
        restart: unless-stopped
        depends_on:
            - app
            - db
            - redis
        dns:
            - 8.8.8.8
            - 1.1.1.1
volumes:
    db_data:
    redis_data:
